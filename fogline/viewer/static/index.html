<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogline</title>
<link rel="stylesheet" href="viewer.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<div class="shell">
  <main id="scene" class="table">
    <div id="flat" class="flat" hidden>
      <canvas id="map" width="768" height="768" tabindex="0"
              aria-label="Map of the world. Click a town to read about it."></canvas>
    </div>
  </main>

  <div class="rail">
    <section class="col run" aria-labelledby="run-title">
      <h1 id="run-title">Fogline</h1>
      <label class="pick">
        <span>Run</span>
        <select id="run"></select>
      </label>
      <p id="run-note" class="note"></p>
      <div class="time">
        <button id="back" type="button" aria-label="Back a year">&#8249;</button>
        <button id="play" type="button">Play</button>
        <button id="forward" type="button" aria-label="Forward a year">&#8250;</button>
        <output id="when" for="scrub"></output>
      </div>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Point in the run">
      <label class="pick follow">
        <input id="follow" type="checkbox">
        <span>Follow the run as it plays</span>
      </label>
      <p id="readout" class="note" aria-live="polite"></p>
      <p class="note">Drag to turn the block, right-drag to slide it, scroll to zoom. R puts it back.</p>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="col" aria-labelledby="civs-title">
      <h2 id="civs-title">Civilisations</h2>
      <ol id="civs" class="civs"></ol>
    </section>

    <section class="col">
      <section id="town" class="town" aria-labelledby="town-title" hidden>
        <h2 id="town-title"></h2>
        <p id="town-sub" class="note"></p>
        <dl id="town-facts" class="facts"></dl>
      </section>
      <p id="town-hint" class="note">Click a town on the block to read about it.</p>
    </section>

    <section class="col turn" aria-labelledby="turn-title">
      <h2 id="turn-title">Ruler's turn</h2>
      <label class="pick">
        <span>Civ</span>
        <select id="turn-civ"></select>
      </label>
      <p id="turn-sub" class="note"></p>
      <dl id="turn-facts" class="facts"></dl>
      <details>
        <summary>Reply as sent</summary>
        <pre id="turn-raw" class="raw"></pre>
      </details>
      <details>
        <summary>What it saw</summary>
        <pre id="turn-seen" class="raw"></pre>
      </details>
    </section>
  </div>
</div>
</body>
</html>
